name: Deploy cleaning-schedule

# apps/cleaning-schedule/ を更新したら、テストを通してから Cloudflare にデプロイする。
# 必要な Secrets: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
#   API トークンの権限は Workers Scripts:Edit と D1:Edit のみで足りる。

on:
  push:
    branches: [main]
    paths: ['apps/cleaning-schedule/**', '.github/workflows/deploy.yml']
  pull_request:
    paths: ['apps/cleaning-schedule/**']
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: 'D1 のマイグレーションも適用する（スキーマ変更時のみ）'
        type: boolean
        default: false

defaults:
  run:
    working-directory: apps/cleaning-schedule

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/cleaning-schedule/package-lock.json
      - run: npm ci
      # 割り当てエンジンの新旧一致テストを含む。ここが落ちたらデプロイしない。
      - run: npm test

  deploy:
    needs: test
    # PR ではデプロイしない
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/cleaning-schedule/package-lock.json
      - run: npm ci

      # スキーマ変更は push のついでに当たらないよう、手動実行のときだけ適用する
      - name: マイグレーションを適用
        if: github.event_name == 'workflow_dispatch' && inputs.apply_migrations
        run: npx wrangler d1 migrations apply cleaning-schedule --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: デプロイ
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
